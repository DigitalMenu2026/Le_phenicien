<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réservation Interactive — Le Phénicien</title>
    <link rel="stylesheet" href="Style2.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header-bar">
        <a href="index.html" class="brand-block">
            <div class="gold-anchor"><i class="fa-solid fa-anchor"></i></div>
            <div class="brand-text">
                <span class="brand-name">LE PHÉNICIEN</span>
                <span class="brand-sub">مطعم الفنيقي</span>
            </div>
        </a>
        <a href="index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Accueil</a>
    </header>

    <main class="app-viewport">
        
        <!-- EN-TÊTE COMPACT -->
        <section class="hero-block">
            <h1 class="hero-title"><span class="gold-serif">Réservation de Table</span></h1>
            <p class="hero-subtext">Sélectionnez une table sur l'un des deux plans ci-dessous puis complétez vos informations.</p>
        </section>

        <!-- SÉLECTEUR RAPIDE SUR MOBILE / PETIT ÉCRAN -->
        <div class="plan-toggle-bar">
            <button type="button" class="tab-btn active" onclick="switchPlan(event, 'all')"><i class="fa-solid fa-border-all"></i> Tous les plans</button>
            <button type="button" class="tab-btn" onclick="switchPlan(event, 'terrasse')"><i class="fa-solid fa-umbrella-beach"></i> Terrasse</button>
            <button type="button" class="tab-btn" onclick="switchPlan(event, 'salon')"><i class="fa-solid fa-couch"></i> Salon</button>
        </div>

        <!-- DEUX PLANS CÔTE À CÔTE -->
        <div class="plans-container" id="plansContainer">

            <!-- PLAN A : TERRASSE -->
            <section class="deck-card" id="plan-terrasse">
                <div class="deck-header">
                    <i class="fa-solid fa-umbrella-beach"></i> PLAN A — TERRASSE
                </div>

                <div class="deck-grid">
                    <!-- Rue (7 tables) -->
                    <div class="col-zone">
                        <span class="zone-badge"><i class="fa-solid fa-road"></i> Gauche (Rue)</span>
                        <div class="tables-compact-grid">
                            <button type="button" class="t-square" data-table="Terrasse - T01 (Rue)">T01</button>
                            <button type="button" class="t-square" data-table="Terrasse - T02 (Rue)">T02</button>
                            <button type="button" class="t-square" data-table="Terrasse - T03 (Rue)">T03</button>
                            <button type="button" class="t-square" data-table="Terrasse - T04 (Rue)">T04</button>
                            <button type="button" class="t-square" data-table="Terrasse - T05 (Rue)">T05</button>
                            <button type="button" class="t-square" data-table="Terrasse - T06 (Rue)">T06</button>
                            <button type="button" class="t-square" data-table="Terrasse - T07 (Rue)">T07</button>
                        </div>
                    </div>

                    <!-- Centre (6 tables) -->
                    <div class="col-zone">
                        <span class="zone-badge"><i class="fa-solid fa-compass"></i> Centre</span>
                        <div class="tables-compact-grid">
                            <button type="button" class="t-square" data-table="Terrasse - T08 (Centre)">T08</button>
                            <button type="button" class="t-square" data-table="Terrasse - T09 (Centre)">T09</button>
                            <button type="button" class="t-square" data-table="Terrasse - T10 (Centre)">T10</button>
                            <button type="button" class="t-square" data-table="Terrasse - T11 (Centre)">T11</button>
                            <button type="button" class="t-square" data-table="Terrasse - T12 (Centre)">T12</button>
                            <button type="button" class="t-square" data-table="Terrasse - T13 (Centre)">T13</button>
                        </div>
                    </div>

                    <!-- Mer (8 tables) -->
                    <div class="col-zone">
                        <span class="zone-badge sea-badge"><i class="fa-solid fa-water"></i> Droit (Mer)</span>
                        <div class="tables-compact-grid">
                            <button type="button" class="t-square sea-t" data-table="Terrasse - T14 (Mer 🌊)">T14</button>
                            <button type="button" class="t-square sea-t" data-table="Terrasse - T15 (Mer 🌊)">T15</button>
                            <button type="button" class="t-square sea-t" data-table="Terrasse - T16 (Mer 🌊)">T16</button>
                            <button type="button" class="t-square sea-t" data-table="Terrasse - T17 (Mer 🌊)">T17</button>
                            <button type="button" class="t-square sea-t" data-table="Terrasse - T18 (Mer 🌊)">T18</button>
                            <button type="button" class="t-square sea-t" data-table="Terrasse - T19 (Mer 🌊)">T19</button>
                            <button type="button" class="t-square sea-t" data-table="Terrasse - T20 (Mer 🌊)">T20</button>
                            <button type="button" class="t-square sea-t" data-table="Terrasse - T21 (Mer 🌊)">T21</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- PLAN B : SALON -->
            <section class="deck-card" id="plan-salon">
                <div class="deck-header">
                    <i class="fa-solid fa-couch"></i> PLAN B — SALON
                </div>

                <div class="deck-grid">
                    <!-- Gauche (8 tables) -->
                    <div class="col-zone">
                        <span class="zone-badge"><i class="fa-solid fa-chair"></i> Gauche</span>
                        <div class="tables-compact-grid">
                            <button type="button" class="t-square" data-table="Salon - S01 (Gauche)">S01</button>
                            <button type="button" class="t-square" data-table="Salon - S02 (Gauche)">S02</button>
                            <button type="button" class="t-square" data-table="Salon - S03 (Gauche)">S03</button>
                            <button type="button" class="t-square" data-table="Salon - S04 (Gauche)">S04</button>
                            <button type="button" class="t-square" data-table="Salon - S05 (Gauche)">S05</button>
                            <button type="button" class="t-square" data-table="Salon - S06 (Gauche)">S06</button>
                            <button type="button" class="t-square" data-table="Salon - S07 (Gauche)">S07</button>
                            <button type="button" class="t-square" data-table="Salon - S08 (Gauche)">S08</button>
                        </div>
                    </div>

                    <!-- Centre (5 tables) -->
                    <div class="col-zone">
                        <span class="zone-badge"><i class="fa-solid fa-compass"></i> Centre</span>
                        <div class="tables-compact-grid">
                            <button type="button" class="t-square" data-table="Salon - S09 (Centre)">S09</button>
                            <button type="button" class="t-square" data-table="Salon - S10 (Centre)">S10</button>
                            <button type="button" class="t-square" data-table="Salon - S11 (Centre)">S11</button>
                            <button type="button" class="t-square" data-table="Salon - S12 (Centre)">S12</button>
                            <button type="button" class="t-square" data-table="Salon - S13 (Centre)">S13</button>
                        </div>
                    </div>

                    <!-- Droit (8 tables) -->
                    <div class="col-zone">
                        <span class="zone-badge"><i class="fa-solid fa-chair"></i> Droit</span>
                        <div class="tables-compact-grid">
                            <button type="button" class="t-square" data-table="Salon - S14 (Droit)">S14</button>
                            <button type="button" class="t-square" data-table="Salon - S15 (Droit)">S15</button>
                            <button type="button" class="t-square" data-table="Salon - S16 (Droit)">S16</button>
                            <button type="button" class="t-square" data-table="Salon - S17 (Droit)">S17</button>
                            <button type="button" class="t-square" data-table="Salon - S18 (Droit)">S18</button>
                            <button type="button" class="t-square" data-table="Salon - S19 (Droit)">S19</button>
                            <button type="button" class="t-square" data-table="Salon - S20 (Droit)">S20</button>
                            <button type="button" class="t-square" data-table="Salon - S21 (Droit)">S21</button>
                        </div>
                    </div>
                </div>
            </section>

        </div>

        <!-- FORMULAIRE DE RÉSERVATION ÉVOLUÉ -->
        <section class="reservation-box" id="formSection">
            <div class="form-header-badge">
                <i class="fa-solid fa-utensils"></i>
                <h2>Détails de la Réservation</h2>
            </div>
            
            <form class="advanced-form" id="bookingForm">
                <div class="form-grid">
                    
                    <!-- Table Sélectionnée -->
                    <div class="form-group full-width highlight-group">
                        <label for="tableSelected"><i class="fa-solid fa-chair"></i> Table Sélectionnée <span class="required">*</span></label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-location-dot field-icon"></i>
                            <input type="text" id="tableSelected" name="table" readonly placeholder="Cliquez sur une table ci-dessus..." required>
                        </div>
                    </div>

                    <!-- Nom & Prénom -->
                    <div class="form-group">
                        <label for="fullName"><i class="fa-solid fa-user"></i> Nom & Prénom <span class="required">*</span></label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-id-card field-icon"></i>
                            <input type="text" id="fullName" name="fullName" required placeholder="ex: Ahmed Ben Ali">
                        </div>
                    </div>

                    <!-- Téléphone -->
                    <div class="form-group">
                        <label for="phone"><i class="fa-solid fa-phone"></i> Téléphone <span class="required">*</span></label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-mobile-screen field-icon"></i>
                            <input type="tel" id="phone" name="phone" required placeholder="ex: 25 215 570">
                        </div>
                    </div>

                    <!-- Date -->
                    <div class="form-group">
                        <label for="resDate"><i class="fa-solid fa-calendar-days"></i> Date de Réservation <span class="required">*</span></label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-calendar field-icon"></i>
                            <input type="date" id="resDate" name="resDate" required>
                        </div>
                    </div>

                    <!-- Heure -->
                    <div class="form-group">
                        <label for="resTime"><i class="fa-solid fa-clock"></i> Heure d'Arrivée <span class="required">*</span></label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-clock field-icon"></i>
                            <select id="resTime" name="resTime" required>
                                <option value="" disabled selected>Choisir un créneau...</option>
                                <optgroup label="Déjeuner">
                                    <option value="12:00">12:00</option>
                                    <option value="12:30">12:30</option>
                                    <option value="13:00">13:00</option>
                                    <option value="13:30">13:30</option>
                                    <option value="14:00">14:00</option>
                                </optgroup>
                                <optgroup label="Dîner">
                                    <option value="19:00">19:00</option>
                                    <option value="19:30">19:30</option>
                                    <option value="20:00">20:00</option>
                                    <option value="20:30">20:30</option>
                                    <option value="21:00">21:00</option>
                                    <option value="21:30">21:30</option>
                                    <option value="22:00">22:00</option>
                                    <option value="22:30">22:30</option>
                                     <option value="23:00">23:00</option>
                                     <option value="23:30">23:30</option>

                                </optgroup>
                            </select>
                        </div>
                    </div>

                    <!-- Nombre de Personnes -->
                    <div class="form-group">
                        <label for="guests"><i class="fa-solid fa-users"></i> Personnes <span class="required">*</span></label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-user-group field-icon"></i>
                            <select id="guests" name="guests" required>
                                <option value="1">1 Personne</option>
                                <option value="2" selected>2 Personnes</option>
                                <option value="3">3 Personnes</option>
                                <option value="4">4 Personnes</option>
                                <option value="5">5 Personnes</option>
                                <option value="6">6 Personnes</option>
                                <option value="7+">7+ Personnes (Groupe)</option>
                                <option value="vip">Salon VIP / Événement</option>
                            </select>
                        </div>
                    </div>

                    <!-- Email (Optionnel) -->
                    <div class="form-group">
                        <label for="email"><i class="fa-solid fa-envelope"></i> E-mail <span class="optional">(Optionnel)</span></label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-at field-icon"></i>
                            <input type="email" id="email" name="email" placeholder="votre@email.com">
                        </div>
                    </div>

                    <!-- Remarques Spéciales -->
                    <div class="form-group full-width">
                        <label for="notes"><i class="fa-solid fa-comment-dots"></i> Remarques / Demandes Spéciales</label>
                        <textarea id="notes" name="notes" rows="2" placeholder="Anniversaire, chaise haute pour enfant, allergies, préférence particulière..."></textarea>
                    </div>

                    <!-- Bouton de Validation -->
                    <div class="form-group full-width btn-container">
                        <button type="submit" class="btn-reserve btn-block">
                            <i class="fa-solid fa-circle-check"></i> Confirmer la Réservation
                        </button>
                    </div>

                </div>
            </form>
        </section>

    </main>


<!-- SDK Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="script.js"></script>
    <script>
        function switchPlan(evt, plan) {
            const container = document.getElementById('plansContainer');
            const tabs = document.querySelectorAll('.tab-btn');
            
            tabs.forEach(t => t.classList.remove('active'));
            evt.currentTarget.classList.add('active');

            container.setAttribute('data-view', plan);
        }
    </script>
</body>
</html>
